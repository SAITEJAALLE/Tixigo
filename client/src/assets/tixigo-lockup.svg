<!-- client/src/assets/tixigo-lockup.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 160">
  <defs>
    <style>
      .salmon{fill:#eb7d7a}
      .ink{fill:#1f2937}
      .ws{stroke:#fff;stroke-width:8;stroke-linecap:round;fill:none}
      .serif{font-family: "Cinzel", Georgia, "Times New Roman", Times, serif}
      .sans{font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    </style>
    <mask id="cut2">
      <rect x="0" y="0" width="220" height="140" rx="20" fill="#fff"/>
      <circle cx="12"  cy="70" r="14" fill="#000"/>
      <circle cx="208" cy="70" r="14" fill="#000"/>
    </mask>
  </defs>

  <!-- Ticket icon (scaled for brand) -->
  <g transform="translate(8 10)">
    <rect width="220" height="140" rx="20" mask="url(#cut2)" class="salmon"/>
    <line x1="138" y1="12" x2="138" y2="128" stroke="#fff" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="8 12"/>
    <circle cx="84" cy="52" r="26" class="ws"/>
    <circle cx="110" cy="46" r="22" class="ws"/>
    <path d="M84 78c6 14-8 20-12 30" class="ws"/>
    <path d="M110 74c4 12-6 17-9 24" class="ws"/>
    <rect x="156" y="36" width="42" height="10" rx="5" fill="#fff"/>
    <rect x="156" y="54" width="30" height="10" rx="5" fill="#fff"/>
    <rect x="156" y="88" width="30" height="18" rx="5" fill="none" stroke="#fff" stroke-width="6"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="250" y="78" class="serif ink" font-size="64" font-weight="600" letter-spacing="2">TIXIGO</text>
  <text x="250" y="118" class="sans salmon" font-size="28" font-weight="700">Find your choice</text>
</svg>
