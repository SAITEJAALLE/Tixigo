<!-- client/public/tixigo-ticket.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 160">
  <defs>
    <style>
      .salmon{fill:#eb7d7a}
      .w{fill:#fff}
      .ws{stroke:#fff;stroke-width:10;stroke-linecap:round;fill:none}
    </style>
    <!-- Side half-circle notches -->
    <mask id="cut">
      <rect width="256" height="160" rx="18" fill="#fff"/>
      <circle cx="18"  cy="80" r="18" fill="#000"/>
      <circle cx="238" cy="80" r="18" fill="#000"/>
    </mask>
  </defs>

  <!-- Ticket base with notches -->
  <rect width="256" height="160" rx="18" mask="url(#cut)" class="salmon"/>

  <!-- Perforation -->
  <line x1="160" y1="12" x2="160" y2="148" stroke="#fff" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="8 12"/>

  <!-- Balloons (white cut-outs look) -->
  <circle cx="98" cy="60" r="28" class="ws"/>
  <circle cx="122" cy="54" r="22" class="ws"/>
  <path d="M98 88c6 14-8 20-12 30" class="ws"/>
  <path d="M122 84c4 12-6 17-9 24" class="ws"/>

  <!-- Right details (two lines + small rounded box) -->
  <rect x="178" y="36" width="44" height="10" rx="5" class="w"/>
  <rect x="178" y="56" width="32" height="10" rx="5" class="w"/>
  <rect x="178" y="90" width="32" height="18" rx="5" fill="none" stroke="#fff" stroke-width="6"/>
</svg>
